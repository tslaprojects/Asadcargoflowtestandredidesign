name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cargoflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cargoflow?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cargoflow_test?schema=public
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
      - name: Migrations match schema (no drift)
        # integration-тесты уже применили миграции к TEST_DATABASE_URL
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run build
